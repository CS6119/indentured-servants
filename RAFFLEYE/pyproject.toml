[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "raffleye"
version = "0.1.0"
description = "Evidence-first Discord giveaway discovery"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.5,<3", "httpx>=0.28,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "filelock>=3.16,<4", "playwright>=1.64,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
raffleye = "raffleye.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raffleye = ["fixtures/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
